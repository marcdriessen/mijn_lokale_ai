name: Android CI & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: aura-local-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Direct download for the phone: the newest APK as a plain file (no zip) on one fixed release page.
      # Link: https://github.com/<owner>/<repo>/releases/tag/laatste-versie
      - name: Publish APK on the "laatste-versie" release
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LokaleAI.apk
          NOTES="Nieuwste testversie van Local LLM/AI. Gebouwd uit commit ${GITHUB_SHA::7} op $(date -u '+%Y-%m-%d %H:%M') UTC. Tik op LokaleAI.apk om te downloaden."
          if gh release view laatste-versie >/dev/null 2>&1; then
            gh release edit laatste-versie --notes "$NOTES"
          else
            gh release create laatste-versie --title "Laatste testversie" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload laatste-versie LokaleAI.apk --clobber

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
